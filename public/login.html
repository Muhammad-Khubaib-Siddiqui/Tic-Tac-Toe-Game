<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="extended-page">
    <div class="panel-card auth-page">
        <h1>LOGIN</h1>
        <form id="login-form" action="/auth/login" method="POST">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="input-field" placeholder="Enter username">
                <div class="error-text" id="username-error"></div>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="input-field" placeholder="Enter password">
                <div class="error-text" id="password-error"></div>
            </div>

            <button type="submit" class="action-btn" style="margin-top: 2vmin;">LOGIN</button>
        </form>
        
        <div>
            <a href="signup.html" class="link-text">Don't have an account? Sign Up</a>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
