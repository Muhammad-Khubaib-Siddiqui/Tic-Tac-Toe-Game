<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="extended-page">
    <div class="panel-card auth-page">
        <h1>SIGN UP</h1>
        <form id="signup-form" method="POST">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="input-field" placeholder="Choose a username">
                <div class="error-text" id="username-error"></div>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="input-field" placeholder="Create a password">
                <div class="error-text" id="password-error"></div>
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" class="input-field" placeholder="Confirm password">
                <div class="error-text" id="confirm-password-error"></div>
            </div>

            <button type="submit" class="action-btn" style="margin-top: 2vmin;">CREATE ACCOUNT</button>
        </form>
        
        <div>
            <a href="login.html" class="link-text">Already have an account? Login</a>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
